<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Hayat Ijmāʿ</title>
<style>
:root{--bg:#050505;--panel:#121212;--line:#2a2a2a;--red:#e8281c;--red2:#a81a12;--ink:#f4f4f4;--dim:#9a9a9a;--read:#4fc3f7;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;border-inline:1px solid var(--line);position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(135deg,#2a0907,#0e0e0e 70%);border-bottom:2px solid var(--red);box-shadow:0 2px 14px #e8281c44}
#hl{flex:1;display:flex;align-items:center;gap:10px;min-width:0}#hl img{width:40px;height:40px;border-radius:50%}
#hl small{display:block;color:var(--dim);font-size:12px}#hl b{display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--red);color:#fff;transition:transform .12s,filter .12s}
button:active{transform:scale(.92);filter:brightness(1.2)}button.g{background:#232323;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#bar{background:#3a0f0c;color:#ffd7d3;text-align:center;font-size:13px;padding:5px;display:none}
#tabs{display:flex;background:var(--panel)}.tab{flex:1;border-radius:0;background:none;color:var(--dim);padding:11px;border-bottom:3px solid transparent}.tab.on{color:#fff;border-color:var(--red)}
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
main.chat{background:radial-gradient(circle at 20% 10%,#2a090622,transparent 45%),radial-gradient(circle at 85% 80%,#e8281c14,transparent 40%),#070707}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;animation:fade .3s both}.row:hover,.row:active{background:#141010}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:linear-gradient(135deg,#e8281c,#7a110b)}
.av.g1{background:linear-gradient(135deg,#ff7a18,#a8320b)}.av.g2{background:linear-gradient(135deg,#c2185b,#5a0b2a)}.av.g3{background:linear-gradient(135deg,#6d28d9,#2a1060)}.av.g4{background:linear-gradient(135deg,#0e8f6e,#064a39)}.av.g5{background:linear-gradient(135deg,#2563eb,#12286b)}
.row b{display:block}.row span,.note{color:var(--dim);font-size:13px}.row div:nth-child(2){min-width:0}.row span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{margin-inline-start:auto;background:var(--red);border-radius:12px;padding:1px 8px;font-size:12px;animation:pop .3s}.tm{margin-inline-start:auto;color:var(--dim);font-size:12px}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;font-size:22px;box-shadow:0 6px 18px #e8281c66;padding:0}
#msgs{padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:7px 10px;border-radius:14px 14px 14px 4px;background:#1c1c1c;align-self:flex-start;overflow-wrap:anywhere;cursor:pointer}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#c4211a,#8e150f);border-radius:14px 14px 4px 14px}.m.pop{animation:pop .25s}
.m>i{display:block;font-style:normal;color:#ff8a80;font-size:12px;font-weight:600}
.m .t{float:right;margin:4px 0 0 10px;font-size:11px;color:#ddd}.t .read{color:var(--read)}.t .failed{color:#ff5252}
.m::after{content:"";display:block;clear:both}
.rq{border-left:3px solid #fff8;background:#0004;border-radius:6px;padding:3px 8px;margin-bottom:5px;font-size:13px;color:#ddd}.rq b{display:block;font-size:12px;color:#ffb4ab}
.im{display:block;max-width:100%;max-height:260px;min-width:120px;min-height:80px;border-radius:10px;background:#0006;margin-bottom:3px}
.vn{display:flex;align-items:center;gap:8px;min-width:200px}.pl{width:38px;height:38px;border-radius:50%;padding:0;background:#fff;color:#a81a12;flex:none}
.wf{flex:1;display:flex;align-items:center;gap:2px;height:30px;--p:0}.wf s{flex:1;background:#fff5;border-radius:2px;min-width:2px}.wf s.on{background:#fff}.du{font-size:12px;color:#eee}
.fl{display:flex;gap:10px;align-items:center;min-width:200px}.fi{font-size:26px}.fl span{display:block;font-size:12px;color:#ddd}
.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.rx{background:#0006;border-radius:12px;padding:0 7px;font-size:13px;animation:pop .25s}.rx.mine{outline:1px solid #fff8}
.day{align-self:center;background:#1b1b1b;color:var(--dim);font-size:12px;padding:2px 10px;border-radius:10px;margin:6px 0}
#foot{background:var(--panel);border-top:1px solid var(--line)}
#cmp,#rb{display:flex;gap:6px;padding:8px;align-items:center}.ic{background:none;font-size:20px;padding:6px 8px}
input[type=text],input:not([type]){flex:1;background:#1c1c1c;border:1px solid var(--line);border-radius:20px;padding:10px 14px;color:var(--ink);font:inherit;min-width:0}
#act{border-radius:50%;width:44px;height:44px;padding:0;font-size:18px}
#rb{display:none}#rb .dot{width:12px;height:12px;border-radius:50%;background:#f33;animation:blink 1s infinite}#rt{font-variant-numeric:tabular-nums;flex:0}#rb .note{flex:1}
.rpb{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#1a1a1a;border-left:4px solid var(--red);font-size:13px;animation:up .2s}.rpb div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rpb b{display:block;color:#ffb4ab;font-size:12px}
.sr{padding:10px 12px}.sr input{width:100%}.box{margin:10px 12px;padding:10px;border:1px dashed var(--red);border-radius:8px;font-size:14px}
.join{padding:24px 22px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}.join img{width:140px;border-radius:50%;animation:pop .5s}.join input{width:100%;border-radius:8px}
.ar{font-size:30px;margin:0}.hr{display:flex;gap:8px;width:100%}.err{color:#ff8a80;font-size:13px;margin:0;min-height:18px}
#sh,#lb{position:absolute;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .15s}#lb{align-items:center}#lb img{max-width:96%;max-height:90%;border-radius:8px}
.sb{width:100%;background:#181818;border-radius:18px 18px 0 0;padding:14px;display:flex;flex-direction:column;gap:8px;animation:up .2s}
.em{display:flex;justify-content:space-around}.em button{background:#242424;font-size:24px;border-radius:50%;width:48px;height:48px;padding:0}
.co{position:absolute;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#4a0e0a,#050505 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fade .25s}
.rg{padding:18px;border-radius:50%;animation:ring 1.6s infinite}.rg .av{width:110px;height:110px;font-size:44px}.co h2{margin:0}.cb{display:flex;gap:26px;margin-top:24px}
.cb button{width:66px;height:66px;border-radius:50%;font-size:26px;padding:0}.cb .end{background:#d32f2f}.cb .ok{background:#2e9e4f;animation:pop .6s infinite alternate}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#222;border:1px solid var(--red);padding:8px 14px;border-radius:20px;font-size:13px;z-index:50;animation:up .2s;max-width:90%}
.pk{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.pk input{flex:none;width:20px;height:20px;accent-color:#e8281c}
#rv,#lv{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;object-fit:cover;background:#000}
#rv.on{inset:0;width:100%;height:100%;opacity:1;z-index:38}
#lv.on{top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:96px;height:128px;opacity:1;z-index:46;border-radius:12px;border:2px solid #fff6;transform:scaleX(-1)}
.co.vid{background:none;justify-content:flex-end;padding-bottom:30px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}@keyframes blink{50%{opacity:.2}}
@keyframes ring{0%{box-shadow:0 0 0 0 #e8281c88}100%{box-shadow:0 0 0 38px #e8281c00}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app">

const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};

let S=load('ijma2',{me:null,msgs:[],cursor:{},recs:{},unread:{},convs:[],contacts:[]}),cur=null,tab='chats',sim=false,busy=false,qs='',inv='',reply=null,grp=null,stick=false,popId=null,rec=null,call=null,ring=null;

const esc=t=>{const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML};
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)>>>0;
const av=(h,z)=>`<div class="av g${hash(h)%6}" ${z?`style="width:${z}px;height:${z}px"`:''}>${esc((h||'?')[0].toUpperCase())}</div>`;
const isLead=()=>['owner','leader','admin'].includes(S.me.role),HRE=/^[A-Za-z][A-Za-z0-9_-]{2,19}$/;
const byOrder=(a,b)=>(a.serverSeq??1e15)-(b.serverSeq??1e15)||(a.createdAtClient||0)-(b.createdAtClient||0);
const tOf=m=>m.serverTime||m.createdAtClient,hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const prev=m=>!m?'Message':m.type==='voice'?'🎤 Voice message '+fmt((m.meta||{}).dur||0):m.type==='image'?'📷 Photo':m.type==='file'?'📎 '+((m.meta||{}).name||'File'):m.body;

function randId(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',w=['Falcon','Noor','Amanah','Hikmah','Salam','Nasr'];return w[Math.random()*w.length|0]+'-'+[0,0,0,0].map(()=>A[Math.random()*A.length|0]).join('')}
function nat(){try{if(!window.AndroidNative||!S.me||!API_URL)return;if(!window._np){window._np=1;AndroidNative.requestNotifPerm()}
  AndroidNative.startSync(JSON.stringify({url:API_URL,userId:S.me.userId,token:S.me.token,cursors:S.cursor,names:Object.fromEntries(S.convs.map(c=>[c.convId,c.name]))}))}catch(e){}}
// ----- local media store (IndexedDB) -----
const idb=new Promise(r=>{try{const q=indexedDB.open('ijma_media',1);q.onupgradeneeded=()=>q.result.createObjectStore('b');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const bget=async k=>{const d=await idb;return d?new Promise(r=>{const q=d.transaction('b').objectStore('b').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}):null};
const bput=async(k,v)=>{const d=await idb;return d?new Promise(r=>{const t=d.transaction('b','readwrite');t.objectStore('b').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()}):0};
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const unb64=(s,t)=>{const a=atob(s),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return new Blob([u],{type:t})};
const URLS={};
async function blobOf(m){const id=(m.meta||{}).mediaId;let b=await bget(m.clientId)||(id&&await bget(id));
  if(!b&&id&&online()){const r=await api('media_get',{mediaId:id});if(r.ok){b=unb64(r.data,r.mime);bput(id,b)}}return b}
async function urlOf(m){if(URLS[m.clientId])return URLS[m.clientId];const b=await blobOf(m);return b?(URLS[m.clientId]=URL.createObjectURL(b)):null}

async function api(action,data={}){
  if(!API_URL)return mock(action,data);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,userId:S.me?.userId,token:S.me?.token,...data})});
  return r.json()}

$('#main').addEventListener('click',e=>{const b=e.target.closest('.m');if(!b||!cur)return;const m=S.msgs.find(x=>x.clientId===b.dataset.k);if(!m)return;
  const rx=e.target.closest('.rx');if(rx)return react(m,rx.dataset.e);
  if(e.target.closest('.pl'))return playVoice(m);if(e.target.closest('img.im')&&e.target.src)return lightbox(e.target.src);
  if(e.target.closest('.fl'))return saveFile(m);sheet(m)});
// ----- voice calls (WebRTC; signalling through the server) -----
const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,4000);pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r()}}});
function mkPc(st){const pc=new RTCPeerConnection({iceServers:ICE});st.getTracks().forEach(t=>pc.addTrack(t,st));
  pc.ontrack=e=>{const v=$('#rv');v.srcObject=e.streams[0];v.play().catch(()=>{});callUI()};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'&&call&&call.state!=='live'){call.state='live';call.t0=Date.now();callUI()}
    if(pc.connectionState==='failed')endCall(true,'Call failed. Network may block direct calls.')};return pc}
function watch(){call.iv=setInterval(async()=>{if(!call||!call.id)return;
  if(call.state==='calling'&&Date.now()-call.t1>45000)return endCall(true,'No answer');
  let r;try{r=await api('call',{op:'poll',callId:call.id})}catch(e){return}if(!r.ok||!call)return;
  if(call.role==='out'&&r.state==='active'&&r.answer&&!call.ans){call.ans=1;try{await call.pc.setRemoteDescription(JSON.parse(r.answer))}catch(e){endCall(true,'Call failed')}}
  if(r.state==='ended'||r.state==='declined')endCall(false,r.state==='declined'?'Call declined':'Call ended')},1500)}
async function startCall(peer,name,video){if(call||ring)return;if(!API_URL)return toast('Calls need your Apps Script server connected (this is demo mode).');if(!online())return toast('You are offline');
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false}),pc=mkPc(st);call={role:'out',peer,name,pc,st,video:!!video,state:'calling',t1:Date.now()};callUI();
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);
    const r=await api('call',{op:'start',to:peer,video:!!video,offer:JSON.stringify(pc.localDescription)});if(!r.ok)throw new Error(r.error);call.id=r.callId;watch()}
  catch(e){endCall(false,'Cannot start the call: '+(e.message||'microphone blocked'))}}
async function acceptCall(){const rg=ring;rg.accepted=true;
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true,video:rg.video?{facingMode:'user'}:false}),pc=mkPc(st);call={role:'in',id:rg.callId,peer:rg.from,name:rg.handle,pc,st,video:!!rg.video,state:'connecting',t1:Date.now()};ring=null;callUI();
    await pc.setRemoteDescription(JSON.parse(rg.offer));await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
    const r=await api('call',{op:'answer',callId:rg.callId,answer:JSON.stringify(pc.localDescription)});if(!r.ok)throw new Error(r.error);watch()}
  catch(e){endCall(true,'Cannot answer: '+(e.message||'microphone blocked'))}}
function endCall(notify,msg){const c=call,id=c?c.id:ring&&ring.callId;
  if(c){clearInterval(c.iv);try{c.pc.close()}catch(e){}c.st&&c.st.getTracks().forEach(t=>t.stop())}
  if(notify&&id)api('call',{op:'end',callId:id}).catch(()=>{});call=null;ring=null;callUI();if(msg)toast(msg)}
function callUI(){let o=$('#co');const rv=$('#rv'),lv=$('#lv');
  if(!call&&!ring){o&&o.remove();rv.className=lv.className='';rv.srcObject=lv.srcObject=null;return}
  const nm=call?call.name:ring.handle,inc=!call,vid=!!(call&&call.video),live=!!(call&&call.state==='live'),showV=vid&&live;
  rv.className=showV?'on':'';lv.className=vid&&call.st&&call.st.getVideoTracks().length?'on':'';if(vid&&lv.srcObject!==call.st)lv.srcObject=call.st;
  if(!o){o=document.createElement('div');o.id='co';$('#app').appendChild(o)}o.className='co'+(showV?' vid':'');
  o.innerHTML=`${showV?'':`<div class="rg">${av(nm)}</div><h2>${esc(nm)}</h2>`}<p id="cs" class="note">${inc?(ring.video?'Incoming video call…':'Incoming voice call…'):live?fmt((Date.now()-call.t0)/1000|0):call.state==='calling'?'Calling…':'Connecting…'}</p>
  <div class="cb">${inc?'<button class="ok" id="ac" aria-label="Accept">📞</button>':'<button class="g" id="mu" aria-label="Mute">🎙️</button>'+(vid?'<button class="g" id="cm" aria-label="Camera">📷</button>':'')}<button class="end" id="en" aria-label="End call">📵</button></div>`;
  $('#en').onclick=()=>endCall(true,inc?'Call declined':'Call ended');if(inc)$('#ac').onclick=acceptCall;
  else{$('#mu').onclick=e=>{const t=call.st.getAudioTracks()[0];t.enabled=!t.enabled;e.target.textContent=t.enabled?'🎙️':'🔇'};
   if(vid)$('#cm').onclick=e=>{const t=call.st.getVideoTracks()[0];if(t){t.enabled=!t.enabled;e.target.textContent=t.enabled?'📷':'🚫'}}}}
setInterval(()=>{if(call&&call.state==='live'&&$('#cs'))$('#cs').textContent=fmt((Date.now()-call.t0)/1000|0)},1000);
$('#sim').onclick=()=>{sim=!sim;render();flush()};
if(window.AndroidNative)$('#sim').style.display='none';
window.onBack=()=>{if($('#sh')||$('#lb')){($('#sh')||$('#lb')).remove();return true}if(call||ring)return true;if(grp){grp=null;render();return true}if(cur){cur=null;render();return true}if(tab!=='chats'){tab='chats';render();return true}return false};
render();flush();
</script></body></html>
